volumes:
  mosquitto_data:
  mosquitto_log:
  postgres_data:
  timescaledb_data:
  redis_data:

networks:
  factory-network:
    driver: bridge

services:
  # MQTT Broker
  mqttbroker:
    image: eclipse-mosquitto:latest
    container_name: factory-mqtt
    ports:
      - "31883:1883"
      - "9002:9001"
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - factory-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck -W 3"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: factory-postgres
    environment:
      POSTGRES_USER: factory_user
      POSTGRES_PASSWORD: factory_pass
      POSTGRES_DB: factory_db
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/databases/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - factory-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory_user -d factory_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # TimescaleDB for Time-Series Data
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: factory-timescaledb
    environment:
      POSTGRES_USER: factory_user
      POSTGRES_PASSWORD: factory_pass
      POSTGRES_DB: factory_timeseries
    ports:
      - "5433:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./infrastructure/databases/init-timescaledb.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - factory-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory_user -d factory_timeseries"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: factory-redis
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    networks:
      - factory-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  # Cutting Machine Service
  cutting-machine-01:
    build:
      context: .
      dockerfile: services/machines/cutting/Dockerfile
    container_name: cutting-machine-01
    environment:
      MACHINE_ID: cutting-01
      MACHINE_TYPE: cutting
      MQTT_BROKER: mqttbroker
      MQTT_PORT: 1883
      FACTORY_SITE_ID: site-01
      MACHINE_SENSOR_UPDATE_INTERVAL: 2
      MACHINE_DATA_PUBLISH_INTERVAL: 5
      SERVICE_NAME: cutting-machine-01
    depends_on:
      mqttbroker:
        condition: service_healthy
    networks:
      - factory-network
    restart: unless-stopped

  # Sewing Machine Service
  sewing-machine-01:
    build:
      context: .
      dockerfile: services/machines/sewing/Dockerfile
    container_name: sewing-machine-01
    environment:
      MACHINE_ID: sewing-01
      MACHINE_TYPE: sewing
      MQTT_BROKER: mqttbroker
      MQTT_PORT: 1883
      FACTORY_SITE_ID: site-01
      MACHINE_SENSOR_UPDATE_INTERVAL: 2
      MACHINE_DATA_PUBLISH_INTERVAL: 5
      SERVICE_NAME: sewing-machine-01
    depends_on:
      mqttbroker:
        condition: service_healthy
    networks:
      - factory-network
    restart: unless-stopped

  # Ironing Machine Service
  ironing-machine-01:
    build:
      context: .
      dockerfile: services/machines/ironing/Dockerfile
    container_name: ironing-machine-01
    environment:
      MACHINE_ID: ironing-01
      MACHINE_TYPE: ironing
      MQTT_BROKER: mqttbroker
      MQTT_PORT: 1883
      FACTORY_SITE_ID: site-01
      MACHINE_SENSOR_UPDATE_INTERVAL: 2
      MACHINE_DATA_PUBLISH_INTERVAL: 5
      SERVICE_NAME: ironing-machine-01
    depends_on:
      mqttbroker:
        condition: service_healthy
    networks:
      - factory-network
    restart: unless-stopped

  # Printing Machine Service
  printing-machine-01:
    build:
      context: .
      dockerfile: services/machines/printing/Dockerfile
    container_name: printing-machine-01
    environment:
      MACHINE_ID: printing-01
      MACHINE_TYPE: printing
      MQTT_BROKER: mqttbroker
      MQTT_PORT: 1883
      FACTORY_SITE_ID: site-01
      MACHINE_SENSOR_UPDATE_INTERVAL: 2
      MACHINE_DATA_PUBLISH_INTERVAL: 5
      SERVICE_NAME: printing-machine-01
    depends_on:
      mqttbroker:
        condition: service_healthy
    networks:
      - factory-network
    restart: unless-stopped

  # Quality Check Machine Service
  qualitycheck-machine-01:
    build:
      context: .
      dockerfile: services/machines/qualitycheck/Dockerfile
    container_name: qualitycheck-machine-01
    environment:
      MACHINE_ID: qualitycheck-01
      MACHINE_TYPE: qualitycheck
      MQTT_BROKER: mqttbroker
      MQTT_PORT: 1883
      FACTORY_SITE_ID: site-01
      MACHINE_SENSOR_UPDATE_INTERVAL: 2
      MACHINE_DATA_PUBLISH_INTERVAL: 5
      SERVICE_NAME: qualitycheck-machine-01
    depends_on:
      mqttbroker:
        condition: service_healthy
    networks:
      - factory-network
    restart: unless-stopped

  # Folding Machine Service
  folding-machine-01:
    build:
      context: .
      dockerfile: services/machines/folding/Dockerfile
    container_name: folding-machine-01
    environment:
      MACHINE_ID: folding-01
      MACHINE_TYPE: folding
      MQTT_BROKER: mqttbroker
      MQTT_PORT: 1883
      FACTORY_SITE_ID: site-01
      MACHINE_SENSOR_UPDATE_INTERVAL: 2
      MACHINE_DATA_PUBLISH_INTERVAL: 5
      SERVICE_NAME: folding-machine-01
    depends_on:
      mqttbroker:
        condition: service_healthy
    networks:
      - factory-network
    restart: unless-stopped

  # Packaging Machine Service
  packaging-machine-01:
    build:
      context: .
      dockerfile: services/machines/packaging/Dockerfile
    container_name: packaging-machine-01
    environment:
      MACHINE_ID: packaging-01
      MACHINE_TYPE: packaging
      MQTT_BROKER: mqttbroker
      MQTT_PORT: 1883
      FACTORY_SITE_ID: site-01
      MACHINE_SENSOR_UPDATE_INTERVAL: 2
      MACHINE_DATA_PUBLISH_INTERVAL: 5
      SERVICE_NAME: packaging-machine-01
    depends_on:
      mqttbroker:
        condition: service_healthy
    networks:
      - factory-network
    restart: unless-stopped

  # Production Orchestrator Service
  production-orchestrator:
    build:
      context: .
      dockerfile: services/production-orchestrator/Dockerfile
    container_name: production-orchestrator
    environment:
      MQTT_BROKER: mqttbroker
      MQTT_PORT: 1883
      FACTORY_SITE_ID: site-01
      PRODUCTION_LOOP_INTERVAL: 5
      PRODUCTION_SUCCESS_RATE: 0.95
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: factory_db
      DB_USER: factory_user
      DB_PASSWORD: factory_pass
      TIMESCALE_HOST: timescaledb
      SERVICE_NAME: production-orchestrator
    depends_on:
      mqttbroker:
        condition: service_healthy
      postgres:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    networks:
      - factory-network
    restart: unless-stopped

  # Original Factory Simulator (for backward compatibility)
  factory-simulator:
    build:
      context: ./simple_factory_simulator/
      dockerfile: Dockerfile
    container_name: factory-simulator-legacy
    ports:
      - "5001:5001"
    environment:
      MQTT_BROKER: mqttbroker
      MQTT_PORT: 1883
      MQTT_WS_PORT: 9001
      WEBAPP_PORT: 5001
      MACHINE_DATA_PUBLISH_INTERVAL: 10
      PRODUCTION_LOOP_INTERVAL: 5
    depends_on:
      mqttbroker:
        condition: service_healthy
    networks:
      - factory-network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./tshirt-customizer/
      dockerfile: Dockerfile
    container_name: factory-frontend
    ports:
      - "8080:80"
    environment:
      - API_URL=factory-simulator:5001
    networks:
      - factory-network
    restart: unless-stopped
