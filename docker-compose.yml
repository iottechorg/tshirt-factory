volumes:
  mosquitto_data:
  mosquitto_log:
services:
  factory-simulator:
    build:
      context: .
      dockerfile: ./factory_ui_simulator/Dockerfile
      args:
        WEBAPP_PORT: 5001  # Default port for the web app
    ports:
      - 5001:5001 # Map the web app port to the host
    environment:
      MQTT_BROKER: ${MQTT_BROKER:-tshirt-factory-001-mqtt}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_WS_PORT: ${MQTT_WS_PORT:-9001}
      MQTT_PUBLIC_HOST: ${MQTT_PUBLIC_HOST:-localhost}
      WEBAPP_PORT: ${WEBAPP_PORT:-5001}
      FACTORY_SITE_ID: ${FACTORY_SITE_ID:-tshirt-factory-001}
      MACHINE_DATA_PUBLISH_INTERVAL: ${MACHINE_DATA_PUBLISH_INTERVAL:-10}
      PRODUCTION_LOOP_INTERVAL: ${PRODUCTION_LOOP_INTERVAL:-5}
      MACHINE_DATA_REST_REQUEST_INTERVAL: ${MACHINE_DATA_REST_REQUEST_INTERVAL:-10}
      HF_TOKEN: ${HF_TOKEN}
      HF_PROVIDER: ${HF_PROVIDER:-together}
    volumes:
      - ./generated-factories:/generated-factories:ro
    networks:
      - tshirt-factory-001-network

  frontend:
    build:
      context: ./customer-order-ui/
      dockerfile: Dockerfile
    ports:
      - "8080:80" 
    environment:
        # NOTE: This is used by the browser. It MUST be reachable from the host.
        # Use http://localhost:5001 if developing on local machine.
       - API_URL=http://localhost:5001
    restart: always
    networks:
      - tshirt-factory-001-network
networks:
  tshirt-factory-001-network:
    external:
      name: tshirt-factory-001_tshirt-factory-001-network