volumes:
  mosquitto_data:
  mosquitto_log:

services:
  factory-simulator:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WEBAPP_PORT: ${WEBAPP_PORT}  # Pass the desired port during build
    network_mode: host
    environment:
        MQTT_BROKER: localhost # With host networking, MQTT broker is on localhost
        MQTT_PORT: 31883 # Use the host-mapped port from generated factory
        MQTT_WS_PORT: 9001
        WEBAPP_PORT: 5002 # The flask app port number
        MACHINE_DATA_PUBLISH_INTERVAL: 10 # in seconds
        PRODUCTION_LOOP_INTERVAL: 5 # in seconds
        MACHINE_DATA_REST_REQUEST_INTERVAL: 10 # in seconds
