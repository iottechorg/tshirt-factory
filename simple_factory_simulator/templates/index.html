<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factory Simulator - IoT Manufacturing Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./static/style.css">
</head>
<body class="bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50 min-h-screen">
    <!-- Navigation Header -->
    <nav class="bg-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-3">
                    <!-- Factory Icon -->
                    <svg class="w-8 h-8 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/>
                    </svg>
                    <h1 class="text-2xl font-bold text-gray-900">Factory Simulator</h1>
                </div>
                <div class="flex space-x-1">
                    <button onclick="showTab('machine-monitoring')"
                            class="tab-btn px-6 py-2 rounded-lg text-sm font-semibold transition-all duration-200 text-white bg-gradient-to-r from-indigo-600 to-purple-600"
                            data-tab="machine-monitoring">
                        <svg class="inline w-5 h-5 mr-2 -mt-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"/>
                        </svg>
                        Machines
                    </button>
                    <button onclick="showTab('production-monitoring')"
                            class="tab-btn px-6 py-2 rounded-lg text-sm font-semibold transition-all duration-200 text-gray-700 hover:bg-gray-100"
                            data-tab="production-monitoring">
                        <svg class="inline w-5 h-5 mr-2 -mt-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                        </svg>
                        Production
                    </button>
                    <button onclick="showTab('test-cases')"
                            class="tab-btn px-6 py-2 rounded-lg text-sm font-semibold transition-all duration-200 text-gray-700 hover:bg-gray-100"
                            data-tab="test-cases">
                        <svg class="inline w-5 h-5 mr-2 -mt-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                        </svg>
                        Tests
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Machine Monitoring Tab -->
        <div id="machine-monitoring" class="tab-content" style="display: block;">
            <div class="bg-white rounded-2xl shadow-xl p-8 animate-fade-in">
                <div class="space-y-8">
                    <!-- Machine Status -->
                    <div>
                        <h3 class="text-xl font-semibold text-gray-900 mb-4">Machine Status</h3>
                        <div class="bg-white rounded-xl shadow-md p-6">
                            <div class="overflow-hidden rounded-lg border border-gray-200">
                                <table class="min-w-full divide-y divide-gray-200">
                                    <thead class="bg-gray-50">
                                        <tr>
                                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Sensors</th>
                                        </tr>
                                    </thead>
                                    <tbody id="machine-table-body" class="bg-white divide-y divide-gray-200"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- Machine Controls -->
                    <div>
                        <h3 class="text-xl font-semibold text-gray-900 mb-4">Machine Controls</h3>
                        <div class="bg-white rounded-xl shadow-md p-6">
                            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <!-- Machine Selection Card -->
                        <div class="bg-gradient-to-br from-blue-50 to-indigo-50 rounded-xl p-6">
                            <h3 class="text-lg font-semibold text-gray-900 mb-4 flex items-center">
                                <svg class="w-5 h-5 mr-2 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/>
                                </svg>
                                Machine Configuration
                            </h3>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Select Machine</label>
                        <select id="machineSelect"
                                class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all duration-200 bg-white shadow-sm">
                        </select>

                        <div class="mt-6">
                            <button onclick="toggleCollapse('updateMachineForm')"
                                    class="w-full px-4 py-3 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-lg font-semibold hover:from-indigo-700 hover:to-purple-700 transition-all duration-200 shadow-md hover:shadow-lg">
                                Update Machine Settings
                            </button>

                            <div id="updateMachineForm" class="hidden mt-4 bg-white rounded-lg p-5 shadow-md">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Failure Rate</label>
                                <input type="number" id="failureRate" step="0.01"
                                       class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-transparent mb-4">
                                <button id="updateFailureRateBtn"
                                        class="w-full px-4 py-3 bg-green-600 text-white rounded-lg font-semibold hover:bg-green-700 transition-all duration-200">
                                    Apply Failure Rate
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Sensor Update Card -->
                    <div class="bg-gradient-to-br from-purple-50 to-pink-50 rounded-xl p-6">
                        <h3 class="text-lg font-semibold text-gray-900 mb-4 flex items-center">
                            <svg class="w-5 h-5 mr-2 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                            </svg>
                            Sensor Control
                        </h3>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Select Sensor</label>
                        <select id="sensorSelect"
                                class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-purple-500 focus:border-transparent mb-4 bg-white shadow-sm">
                        </select>

                        <label class="block text-sm font-medium text-gray-700 mb-2">Sensor Value</label>
                        <input type="number" id="sensorValue" step="0.01"
                               class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-purple-500 focus:border-transparent mb-4">

                        <button id="updateSensorBtn"
                                class="w-full px-4 py-3 bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-lg font-semibold hover:from-purple-700 hover:to-pink-700 transition-all duration-200 shadow-md hover:shadow-lg">
                            Update Sensor Value
                        </button>
                    </div>
                </div>
            </div>
        </div></div></div></div>

        <!-- Production Monitoring Tab -->
        <div id="production-monitoring" class="tab-content" style="display: none;">
            <div class="bg-white rounded-2xl shadow-xl p-8 animate-fade-in">
                <div class="flex items-center mb-6">
                    <div class="bg-green-100 p-3 rounded-lg mr-4">
                        <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                        </svg>
                    </div>
                    <h2 class="text-3xl font-bold text-gray-900">Production Management</h2>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
                    <!-- Product Configuration Card -->
                    <div class="bg-gradient-to-br from-green-50 to-emerald-50 rounded-xl p-6">
                        <h3 class="text-lg font-semibold text-gray-900 mb-4">Product Configuration</h3>

                        <label class="block text-sm font-medium text-gray-700 mb-2">Product Name</label>
                        <div class="flex space-x-2 mb-4">
                            <input type="text" id="productName"
                                   class="flex-1 px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-green-500 focus:border-transparent">
                            <button id="generateProductNameBtn"
                                    class="px-6 py-3 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg font-semibold transition-all duration-200">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                                </svg>
                            </button>
                        </div>

                        <label class="block text-sm font-medium text-gray-700 mb-2">Product Details (JSON)</label>
                        <div class="flex space-x-2 mb-4">
                            <textarea id="productDetails" rows="3"
                                      class="flex-1 px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-green-500 focus:border-transparent font-mono text-sm"></textarea>
                            <button id="generateProductDetailsBtn"
                                    class="px-6 py-3 bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg font-semibold transition-all duration-200">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                                </svg>
                            </button>
                        </div>

                        <button id="startProductionBtn"
                                class="w-full px-6 py-4 bg-gradient-to-r from-green-600 to-emerald-600 text-white rounded-lg font-bold text-lg hover:from-green-700 hover:to-emerald-700 transition-all duration-200 shadow-lg hover:shadow-xl">
                            Start Production
                        </button>
                    </div>

                    <!-- Production Settings Card -->
                    <div class="bg-gradient-to-br from-blue-50 to-cyan-50 rounded-xl p-6">
                        <h3 class="text-lg font-semibold text-gray-900 mb-4">Production Settings</h3>

                        <label class="block text-sm font-medium text-gray-700 mb-2">Production Success Rate</label>
                        <input type="number" id="productionSuccessRate" step="0.01"
                               class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent mb-4">

                        <button id="updateProductionConfigBtn"
                                class="w-full px-6 py-3 bg-gradient-to-r from-blue-600 to-cyan-600 text-white rounded-lg font-semibold hover:from-blue-700 hover:to-cyan-700 transition-all duration-200 shadow-md hover:shadow-lg">
                            Update Success Rate
                        </button>
                    </div>
                </div>

                <!-- Production Results -->
                <div class="mt-8">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-xl font-semibold text-gray-900">Production Results</h3>
                        <button id="clearProductionResultsBtn"
                                class="px-4 py-2 bg-red-600 text-white rounded-lg font-semibold hover:bg-red-700 transition-all duration-200 shadow-md hover:shadow-lg text-sm">
                            <svg class="inline w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                            </svg>
                            Clear
                        </button>
                    </div>
                    <div id="production-results" class="bg-white rounded-xl shadow-md p-6">
                        <!-- Table will be inserted here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Test Cases Tab -->
        <div id="test-cases" class="tab-content" style="display: none;">
            <div class="bg-white rounded-2xl shadow-xl p-8 animate-fade-in">
                <div class="flex items-center mb-6">
                    <div class="bg-amber-100 p-3 rounded-lg mr-4">
                        <svg class="w-6 h-6 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                        </svg>
                    </div>
                    <h2 class="text-3xl font-bold text-gray-900">Test Cases & Automation</h2>
                </div>

                <div id="test-cases-status" class="mb-6"></div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
                    <!-- Test Execution Card -->
                    <div class="bg-gradient-to-br from-amber-50 to-orange-50 rounded-xl p-6">
                        <h3 class="text-lg font-semibold text-gray-900 mb-4">Test Execution</h3>

                        <label class="block text-sm font-medium text-gray-700 mb-2">Select Test Case</label>
                        <select id="testSelect"
                                class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-amber-500 focus:border-transparent mb-4 bg-white shadow-sm">
                            <option value="All">All</option>
                        </select>

                        <div class="space-y-3">
                            <button id="runTestCaseBtn"
                                    class="w-full px-6 py-3 bg-gradient-to-r from-amber-600 to-orange-600 text-white rounded-lg font-semibold hover:from-amber-700 hover:to-orange-700 transition-all duration-200 shadow-md hover:shadow-lg">
                                Run Test Case
                            </button>
                            <button id="generateRandomTestCaseBtn"
                                    class="w-full px-6 py-3 bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-lg font-semibold hover:from-purple-700 hover:to-pink-700 transition-all duration-200 shadow-md hover:shadow-lg">
                                Generate & Run Random Test
                            </button>
                        </div>
                    </div>

                    <!-- Random Production Card -->
                    <div class="bg-gradient-to-br from-indigo-50 to-purple-50 rounded-xl p-6">
                        <h3 class="text-lg font-semibold text-gray-900 mb-4">Automated Production</h3>

                        <label class="block text-sm font-medium text-gray-700 mb-2">Random Product Interval (seconds)</label>
                        <input type="number" id="randomProductionInterval" step="1" value="20"
                               class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-transparent mb-4">

                        <div class="space-y-3">
                            <button id="startRandomProductionBtn"
                                    class="w-full px-6 py-3 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-lg font-semibold hover:from-indigo-700 hover:to-purple-700 transition-all duration-200 shadow-md hover:shadow-lg">
                                <svg class="inline w-5 h-5 mr-2 -mt-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                </svg>
                                Start Random Production
                            </button>
                            <button id="stopRandomProductionBtn" disabled
                                    class="w-full px-6 py-3 bg-gray-400 text-white rounded-lg font-semibold cursor-not-allowed">
                                <svg class="inline w-5 h-5 mr-2 -mt-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"/>
                                </svg>
                                Stop Random Production
                            </button>
                            <button id="clearProductionResultsBtn"
                                    class="w-full px-6 py-3 bg-red-600 text-white rounded-lg font-semibold hover:bg-red-700 transition-all duration-200 shadow-md hover:shadow-lg">
                                <svg class="inline w-5 h-5 mr-2 -mt-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                                </svg>
                                Clear Production Results
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Random Test Status -->
                <div id="random-test-status" class="mb-6 bg-white rounded-xl shadow-md p-6"></div>

                <!-- Production Results -->
                <div id="production-results" class="bg-white rounded-xl shadow-md p-6"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    <script>
        const API_BASE_URL = "{{ API_BASE_URL }}";
        const MQTT_BROKER = "{{ MQTT_BROKER }}";
        const MQTT_WS_PORT = "{{ MQTT_WS_PORT }}";
        const MQTT_TOPIC_PRODUCTION = "{{ MQTT_TOPIC_PRODUCTION }}";
        const MACHINE_DATA_REST_REQUEST_INTERVAL = "{{MACHINE_DATA_REST_REQUEST_INTERVAL}}";

        // Tab switching functionality
        function showTab(tabId) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.style.display = 'none';
            });

            // Show selected tab
            document.getElementById(tabId).style.display = 'block';

            // Update button styles
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('text-white', 'bg-gradient-to-r', 'from-indigo-600', 'to-purple-600');
                btn.classList.add('text-gray-700', 'hover:bg-gray-100');
            });

            // Highlight active button
            const activeBtn = document.querySelector(`[data-tab="${tabId}"]`);
            activeBtn.classList.remove('text-gray-700', 'hover:bg-gray-100');
            activeBtn.classList.add('text-white', 'bg-gradient-to-r', 'from-indigo-600', 'to-purple-600');
        }

        // Collapse toggle functionality
        function toggleCollapse(elementId) {
            const element = document.getElementById(elementId);
            element.classList.toggle('hidden');
        }

        // Enable/disable stop button functionality
        document.addEventListener('DOMContentLoaded', function() {
            const startBtn = document.getElementById('startRandomProductionBtn');
            const stopBtn = document.getElementById('stopRandomProductionBtn');

            if (startBtn && stopBtn) {
                startBtn.addEventListener('click', function() {
                    stopBtn.disabled = false;
                    stopBtn.classList.remove('bg-gray-400', 'cursor-not-allowed');
                    stopBtn.classList.add('bg-gradient-to-r', 'from-red-600', 'to-rose-600', 'hover:from-red-700', 'hover:to-rose-700', 'shadow-md', 'hover:shadow-lg', 'transition-all', 'duration-200');
                });

                stopBtn.addEventListener('click', function() {
                    stopBtn.disabled = true;
                    stopBtn.classList.remove('bg-gradient-to-r', 'from-red-600', 'to-rose-600', 'hover:from-red-700', 'hover:to-rose-700', 'shadow-md', 'hover:shadow-lg', 'transition-all', 'duration-200');
                    stopBtn.classList.add('bg-gray-400', 'cursor-not-allowed');
                });
            }
        });
    </script>
</body>
</html>
